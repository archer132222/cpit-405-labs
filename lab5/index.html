<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stats</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="container">
        <header>
            <h1>NBA Player Stats</h1>
            <button id="dark-mode-toggle">Toggle Dark Mode</button>
        </header>

        <search class="table-filters">
            <input type="text" id="search" placeholder="Search players...">
            <select id="team-filter">
                <option value="all">All</option>
                <!-- Teams will be populated in JS -->
            </select>
        </search>

        <table id="player-stats">
            <thead>
                <tr>
                    <th data-sort="name" style="cursor: pointer;">Name</th>
                    <th data-sort="team" style="cursor: pointer;">Team</th>
                    <th data-sort="points" style="cursor: pointer;">Points</th>
                    <th data-sort="rebounds" style="cursor: pointer;">Rebounds</th>
                    <th data-sort="assists" style="cursor: pointer;">Assists</th>
                </tr>
            </thead>
            <tbody id="player-rows">
                <!-- Rows will be populated in JS -->
                
                
                    
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>

    <footer style="padding: 20px;">
        <p><a href="..">All labs</a></p>
        <p><a href="#">Back to top</a></p>
    </footer>
</body>

</html>
