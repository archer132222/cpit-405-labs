<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Example</title>
    <style>
        .container {
            background-color: lightgray;
            padding: 20px;
            border: 2px solid black;
        }

        .header {
            font-size: 24px;
            text-align: center;
        }

        .content {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">This is a header inside a div</div>
        <div class="content">
            <p>This is some content inside another div.</p>
            <p>Divs are useful for structuring and styling content.</p>
        </div>
    </div>
</body>
</html>
