<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 4</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 20px;
            }
            label{
                display: block;
                margin-bottom: 5px;
                margin-top: 12px;
            }
            input, textarea {
                width: 300px;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            textarea {
                display: block;
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center;">Great Auto parts - Order form</h1>
        
        <form>
            <label for="Fname">First Name:</label>
            <input type="text" id="Fname" name="Fname" placeholder="Enter your first name" required>
            
            <label for="Lname">Last Name:</label>
            <input type="text" id="Lname" name="Lname" placeholder="Enter your last name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            
            <label for="make">Make:</label>
            <input type="text" id="make" name="make" placeholder="Make" required>

            <label for="model">Model:</label>
            <input type="text" id="model" name="model" placeholder="Model">

            <label for="year">Year:</label>
            <input type="number" id="year" name="year" placeholder="Year">

            <label for="Date">Date:</label>
            <input type="date" id="Date" name="Date" required>

            <label for="spare">Spare Parts:</label>
            <input type="text" id="spare" name="spare" placeholder="Enter the spare part you need" required>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" placeholder="Enter the quantity needed for spare part" required>
            
            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" placeholder="Enter any additional comments or special requests" style="height: 100px;"></textarea>
            
            <input type="submit" value="Submit" style="background-color: #000000; color: white;  padding: 10px 20px; cursor: pointer; ">
        </form>
        <br>
        <hr>
        
        <footer>
        <p><a href="..">All labs</a></p>
        </footer>
        <p><a href="#">Back to top</a></p>
    
    
    
    
    </body>

</html>
